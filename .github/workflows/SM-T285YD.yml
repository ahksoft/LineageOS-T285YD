name: LineageOS-action-build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      BUILD_ROOT: /mnt/lineage
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Install host packages
        run: |
          sudo apt update
          sudo apt -y install git curl python3

      - name: Create build directory
        run: |
          sudo mkdir -p $BUILD_ROOT
          sudo chown -R $USER:$USER $BUILD_ROOT

      - name: Install the repo command
        run: |
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > repo
          sudo mv repo /usr/bin/repo
          sudo chmod a+x /usr/bin/repo

      - name: Configure git
        run: |
          git config --global user.email "build@example.com"
          git config --global user.name "builder"
          git config --global color.ui false

      - name: Initialize and sync the source
        run: |
          cd $BUILD_ROOT
          echo "=== Initializing LineageOS 14.1 repo ==="
          repo init -u https://github.com/LineageOS/android.git -b lineage-14.1 --depth=1

          echo "=== Adding device trees ==="
          mkdir -p .repo/local_manifests
          cat > .repo/local_manifests/gtexsltedd.xml << 'EOF'
<?xml version="1.0" encoding="UTF-8"?>
<manifest>
  <project name="LineageOS/android_device_samsung_gtexsltedd" path="device/samsung/gtexsltedd" remote="github" revision="lineage-14.1" />
  <project name="LineageOS/android_device_samsung_msm8917-common" path="device/samsung/msm8917-common" remote="github" revision="lineage-14.1" />
  <project name="LineageOS/android_kernel_samsung_msm8917" path="kernel/samsung/msm8917" remote="github" revision="lineage-14.1" />
  <project name="TheMuppets/proprietary_vendor_samsung" path="vendor/samsung" remote="github" revision="lineage-14.1" />
</manifest>
EOF

          echo "=== Syncing source ==="
          repo sync -c -j$(nproc) --force-sync --no-clone-bundle --no-tags

          echo "=== Checking directory structure ==="
          ls -la device/samsung/ || true
          ls -la kernel/ || true
          df -h

      # LineageOS 14.1 (Android 7.1) needs an old host toolchain (JDK 8, python2),
      # so the build runs inside an Ubuntu 18.04 container.

      - name: Diagnose kernel setup
        run: |
          cd $BUILD_ROOT
          echo "=== Kernel directory structure ==="
          find kernel -type d -name "*samsung*" 2>/dev/null || true
          echo "=== BoardConfig.mk contents ==="
          cat device/samsung/gtexsltedd/BoardConfig.mk 2>/dev/null | head -50 || true
          echo "=== Checking for kernel source ==="
          grep -r "TARGET_KERNEL_SOURCE" device/samsung/gtexsltedd/ 2>/dev/null || true


      - name: Build boot.img and system.img
        run: |
          docker run --rm \
            -v $BUILD_ROOT:/build \
            -v /usr/bin/repo:/usr/bin/repo \
            -e LC_ALL=C.UTF-8 \
            -e USE_CCACHE=0 \
            -e USER=builder \
            -w /build \
            ubuntu:18.04 bash -c '
              set -ex
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get -y install bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
                git git-lfs gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev \
                libelf-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 \
                libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
                openjdk-8-jdk python python3 unzip wget file bsdmainutils python2

              # Create python2 symlink if needed
              if [ ! -f /usr/bin/python2 ] && [ -f /usr/bin/python ]; then
                ln -s /usr/bin/python /usr/bin/python2
              fi

              git config --global user.email "build@example.com"
              git config --global user.name "builder"

              echo "=== Starting build ==="
              source build/envsetup.sh
              breakfast lineage_gtexsltedd-userdebug || {
                echo "breakfast failed, trying lunch..."
                lunch lineage_gtexsltedd-userdebug
              }

              echo "=== Setting up build environment ==="
              # Set up Android build environment variables
              export ARCH=arm64
              export SUBARCH=arm64
              export TARGET_KERNEL_CROSS_COMPILE_PREFIX=aarch64-linux-android-

              echo "=== Building full ROM with mka ==="
              # Use mka which is optimized for Android builds
              mka bacon || {
                echo "mka bacon failed, trying make -j$(nproc)"
                make -j$(nproc) bacon || {
                  echo "bacon failed, trying bootimage+systemimage"
                  make -j$(nproc) bootimage systemimage
                }
              }

              echo "=== Packaging results ==="
              cd out/target/product/gtexsltedd
              if [ -f boot.img ] && [ -f system.img ]; then
                tar -cvf ap.tar -C ./ boot.img system.img
                echo "Build successful!"
              else
                echo "Build artifacts missing!"
                ls -la
                exit 1
              fi
            '

      - name: Prepare release files
        run: |
          mkdir -p $GITHUB_WORKSPACE/release
          cd $BUILD_ROOT/out/target/product/gtexsltedd
          cp boot.img $GITHUB_WORKSPACE/release/
          # GitHub release assets are limited to 2 GB each
          if [ $(stat -c%s ap.tar) -gt 2000000000 ]; then
            split -b 1900M -d ap.tar $GITHUB_WORKSPACE/release/ap.tar.part
          else
            cp ap.tar $GITHUB_WORKSPACE/release/
          fi
          ls -lh $GITHUB_WORKSPACE/release

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          name: lineageos-sm-t285yd-${{ github.run_id }}
          tag_name: ${{ github.run_id }}
          body: |
            LineageOS 14.1 for SM-T285YD (gtexsltedd)
            Flash ap.tar in AP slot with Odin. If split, join first: cat ap.tar.part* > ap.tar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
