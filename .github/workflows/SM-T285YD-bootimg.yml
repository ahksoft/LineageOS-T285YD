name: LineageOS-bootimg-build

on:
  workflow_dispatch:

jobs:
  build-bootimg:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      BUILD_ROOT: /mnt/lineage
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Install host packages
        run: |
          sudo apt update
          sudo apt -y install git curl python3

      - name: Create build directory
        run: |
          sudo mkdir -p $BUILD_ROOT
          sudo chown -R $USER:$USER $BUILD_ROOT

      - name: Install the repo command
        run: |
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > repo
          sudo mv repo /usr/bin/repo
          sudo chmod a+x /usr/bin/repo

      - name: Configure git
        run: |
          git config --global user.email "build@example.com"
          git config --global user.name "builder"
          git config --global color.ui false

      - name: Initialize and sync the source
        run: |
          cd $BUILD_ROOT
          echo "=== Initializing SM-T285YD LineageOS 14.1 mirror ==="
          repo init -u https://github.com/nothingstopsme/android_LineageOS.git -b cm-14.1_SM-T285YD --depth=1

          echo "=== Syncing source ==="
          repo sync -c -j$(nproc) --force-sync --no-clone-bundle --no-tags

          echo "=== Checking directory structure ==="
          ls -la device/samsung/ || true
          ls -la kernel/samsung/ || true
          df -h

      - name: Diagnose kernel setup
        run: |
          cd $BUILD_ROOT
          echo "=== Kernel directory structure ==="
          find kernel -type d -name "*samsung*" 2>/dev/null || true
          echo "=== BoardConfig.mk contents ==="
          cat device/samsung/gtexsltedd/BoardConfig.mk 2>/dev/null | head -50 || true
          echo "=== Checking for kernel source ==="
          grep -r "TARGET_KERNEL_SOURCE" device/samsung/gtexsltedd/ 2>/dev/null || true

      - name: Build boot.img only
        run: |
          docker run --rm \
            -v $BUILD_ROOT:/build \
            -v /usr/bin/repo:/usr/bin/repo \
            -e LC_ALL=C.UTF-8 \
            -e USE_CCACHE=0 \
            -e USER=builder \
            -w /build \
            ubuntu:18.04 bash -c "
              set -ex
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get -y install bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
                git git-lfs gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev \
                libelf-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 \
                libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
                openjdk-8-jdk python python3 unzip wget file bsdmainutils

              # Ubuntu 18.04 python package is Python 2.7; LineageOS needs /usr/bin/python2.
              if [ ! -f /usr/bin/python2 ] && [ -f /usr/bin/python ]; then
                ln -s /usr/bin/python /usr/bin/python2
              fi

              git config --global user.email 'build@example.com'
              git config --global user.name 'builder'

              # Jack (LineageOS 14.1) needs TLSv1; OpenJDK 8u292+ disables it and
              # then setup-jack-server dies with SSL error / Error 47.
              JAVA_SEC=/usr/lib/jvm/java-8-openjdk-amd64/jre/lib/security/java.security
              sed -i -e 's/, TLSv1.1, TLSv1//' -e 's/, TLSv1, TLSv1.1//' \"\$JAVA_SEC\"
              export JACK_SERVER_VM_ARGUMENTS='-Dfile.encoding=UTF-8 -XX:+TieredCompilation -Xmx3G'
              export ANDROID_JACK_VM_ARGS=\"\$JACK_SERVER_VM_ARGUMENTS\"

              echo '=== Starting build ==='
              source build/envsetup.sh
              breakfast lineage_gtexsltedd-userdebug || {
                echo 'breakfast failed, trying lunch...'
                lunch lineage_gtexsltedd-userdebug
              }

              # SM-T285YD is ARMv7 / sc8830 - building boot.img only.
              echo '=== Building bootimage ==='
              make -j\$(nproc) bootimage

              echo '=== Packaging results ==='
              cd out/target/product/gtexsltedd
              if [ -f boot.img ]; then
                echo 'Boot image built successfully!'
                ls -lh boot.img
              else
                echo 'boot.img missing!'
                ls -la
                exit 1
              fi
            "

      - name: Prepare release files
        run: |
          mkdir -p $GITHUB_WORKSPACE/release
          cp $BUILD_ROOT/out/target/product/gtexsltedd/boot.img $GITHUB_WORKSPACE/release/
          ls -lh $GITHUB_WORKSPACE/release

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          name: lineageos-sm-t285yd-bootimg-${{ github.run_id }}
          tag_name: bootimg-${{ github.run_id }}
          body: |
            LineageOS 14.1 boot.img for SM-T285YD (gtexsltedd)
            This is the kernel + ramdisk image only.
          env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
